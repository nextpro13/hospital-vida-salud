name: Integracion Continua - Hospital Vida Salud

on:
  push:
    branches: [ "main", "feature/**", "fix/**", "demo/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Compilar y probar (todos los modulos)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin) con cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas (mvn verify)
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw --batch-mode --no-transfer-progress verify
          else
            echo "No se encontro Maven Wrapper; se usa el Maven preinstalado del runner"
            mvn --batch-mode --no-transfer-progress verify
          fi

      - name: Resumen de pruebas
        if: always()
        run: |
          echo "## Resultado de pruebas por modulo" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in */target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -H "Tests run" "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7
